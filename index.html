<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beam TV - Stream Boldly</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel Standalone for compiling React/JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Explosive Glassmorphism Styles -->
  <style>
    body {
      background-color: #020204;
      color: white;
      margin: 0;
      overflow-x: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Explosive Glassmorphism Utilities */
    .glass-panel {
      background: rgba(10, 10, 15, 0.4);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 32px rgba(255, 255, 255, 0.05);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 2px 10px rgba(0,0,0,0.2);
    }
    .neon-btn {
      background: linear-gradient(135deg, #00f0ff, #ff00ff);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), 0 0 40px rgba(255, 0, 255, 0.2);
      transition: all 0.3s ease;
    }
    .neon-btn:hover {
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.6), 0 0 60px rgba(255, 0, 255, 0.4);
      filter: brightness(1.2);
    }

    /* Epic Cinematic Intro Animations */
    @keyframes strikeAnim { 0% { width: 0; opacity: 1; height: 2px; } 50% { width: 100vw; opacity: 1; height: 2px; } 100% { width: 100vw; opacity: 0; height: 40vh; filter: blur(20px); } }
    @keyframes textAppear { 0% { transform: scale(0.9); opacity: 0; text-shadow: 0 0 60px rgba(0, 255, 255, 0.6); letter-spacing: -1.4vw; } 100% { transform: scale(1); opacity: 1; text-shadow: 0 0 20px rgba(0, 255, 255, 0.4); letter-spacing: 0.4vw; } }
    @keyframes textZoom { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(28); opacity: 0; filter: blur(8px); } }
    @keyframes splitCyan { 0% { transform: scale(1) translate(0, 0); opacity: 0.6; } 100% { transform: scale(1.08) translate(-1.4vw, -0.8vw); opacity: 0; filter: blur(4px); } }
    @keyframes splitMagenta { 0% { transform: scale(1) translate(0, 0); opacity: 0.45; } 100% { transform: scale(1.1) translate(1.4vw, 0.8vw); opacity: 0; filter: blur(4px); } }
    @keyframes sweepMotion { 0% { background-position: 100% 0; opacity: 0; transform: scale(1); } 30% { opacity: 1; } 100% { background-position: 0% 0; opacity: 0; transform: scale(2.6); filter: blur(40px); } }
    @keyframes pulseOrb { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
    
    .beam-strike { animation: strikeAnim 0.9s ease-out forwards; }
    .beam-text-anim { animation: textAppear 2.2s 0.3s cubic-bezier(0.19, 1, 0.22, 1) forwards, textZoom 1.4s 2.4s cubic-bezier(0.9, 0, 0.1, 1) forwards; }
    .beam-cyan-split { animation: splitCyan 1.4s 2.4s cubic-bezier(0.9, 0, 0.1, 1) forwards; color: #00f0ff; }
    .beam-magenta-split { animation: splitMagenta 1.4s 2.4s cubic-bezier(0.9, 0, 0.1, 1) forwards; color: #ff00ff; }
    .beam-light-sweep { background: linear-gradient(to right, transparent 0%, rgba(0, 240, 255, 0.6) 20%, rgba(255, 0, 255, 0.4) 40%, rgba(0, 240, 255, 0.4) 60%, rgba(255, 0, 255, 0.4) 80%, transparent 100%); background-size: 200% 100%; animation: sweepMotion 1.4s 2.4s cubic-bezier(0.9, 0, 0.1, 1) forwards; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .animate-orb { animation: pulseOrb 8s infinite alternate ease-in-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // --- ES MODULE IMPORTS ---
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0';
    import * as lucide from 'https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0,react-dom@18.2.0';
    
    const { Play, Info, Plus, X, Search, Home, Tv, Film, Bookmark, User, ChevronLeft, ChevronRight, LogOut, Settings, Shield, ShieldAlert, MonitorPlay, Check, Trash2, ListVideo, Mail, Lock, UserPlus, LogIn, ArrowRight } = lucide;

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, updateProfile } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, onSnapshot, query, deleteDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyAPNZttReZ8s6ga5iNChr-cAUGNqbDUsBc",
      authDomain: "beamtv-aed7a.firebaseapp.com",
      projectId: "beamtv-aed7a",
      storageBucket: "beamtv-aed7a.firebasestorage.app",
      messagingSenderId: "357356929853",
      appId: "1:357356929853:web:ae28b4bc613ee2f8427b54"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'beam-tv-ultimate';

    // --- CONFIGURATION ---
    const TMDB_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjZGQ2OWYyZDE5NzgwMWI1ZjA4MDhhY2M4NTVkM2M2ZCIsIm5iZiI6MTc3MzY0MjA0Mi45ODcsInN1YiI6IjY5YjdhMTNhZWNhYzk5MDEwYzIxZGM3YSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.giMqJk1Z5Vsr0WyxK4oazNOYz8BP251Wf6Lg_jbwtjM";
    const TMDB_BASE_URL = "https://api.themoviedb.org/3";
    const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/";

    const SERVERS = [
      { id: 'vidking', name: 'Vidking', buildUrl: (id, type, s, e) => type === 'movie' ? `https://www.vidking.net/embed/movie/${id}?autoPlay=true` : `https://www.vidking.net/embed/tv/${id}/${s}/${e}?autoPlay=true` },
      { id: 'xp', name: 'XP', buildUrl: (id, type, s, e) => type === 'movie' ? `https://xk4l.mzt4pr8wlkxnv0qsha5g.website/watch/${id}` : `https://xk4l.mzt4pr8wlkxnv0qsha5g.website/watch/${id}/${s}/${e}` },
      { id: '67movies', name: '67movies', buildUrl: (id, type, s, e) => type === 'movie' ? `https://67movies.net/watch/movie/${id}` : `https://67movies.net/watch/tv/${id}/${s}/${e}` },
      { id: 'flixer', name: 'Flixer', buildUrl: (id, type, s, e) => type === 'movie' ? `https://tv.vynx.cc/watch/${id}?type=movie` : `https://tv.vynx.cc/watch/${id}?type=tv&season=${s}&episode=${e}` }
    ];

    const DEFAULT_SETTINGS = { provider: 'vidking', strictMode: false };

    // --- API HELPERS ---
    const fetchTMDB = async (endpoint, params = {}) => {
      const url = new URL(`${TMDB_BASE_URL}${endpoint}`);
      Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
      const response = await fetch(url.toString(), {
        headers: { Authorization: `Bearer ${TMDB_TOKEN}`, "Content-Type": "application/json;charset=utf-8" },
      });
      if (!response.ok) throw new Error('TMDB API Error');
      return response.json();
    };

    // --- COMPONENTS ---

    // 0. Explosive Auth Screen
    const AuthScreen = () => {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleEmailAuth = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          if (isLogin) {
            await signInWithEmailAndPassword(auth, email, password);
          } else {
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(userCred.user, { displayName: name });
          }
        } catch (err) { setError(err.message.replace('Firebase: ', '')); } 
        finally { setLoading(false); }
      };

      const handleGoogleAuth = async () => {
        setError('');
        setLoading(true);
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (err) { setError("Google sign-in blocked by browser. Please use Email or Guest mode."); } 
        finally { setLoading(false); }
      };

      const handleGuestAuth = async () => {
        setError('');
        setLoading(true);
        try { await signInAnonymously(auth); } 
        catch(err) { setError(err.message); } 
        finally { setLoading(false); }
      };

      return (
        <div className="fixed inset-0 bg-[#020204] z-[100] flex flex-col items-center justify-center p-6 overflow-hidden">
          <div className="absolute top-[-10%] left-[-10%] w-[800px] h-[800px] bg-[#00f0ff]/15 rounded-full blur-[150px] pointer-events-none animate-orb" />
          <div className="absolute bottom-[-10%] right-[-10%] w-[800px] h-[800px] bg-[#ff00ff]/15 rounded-full blur-[150px] pointer-events-none animate-orb" style={{animationDelay: '-4s'}} />

          <div className="relative z-10 w-full max-w-md glass-panel rounded-3xl p-8 animate-in slide-in-from-bottom-12 duration-700">
            <div className="text-center mb-10">
              <div className="inline-block text-5xl font-black tracking-[0.3em] text-transparent bg-clip-text bg-gradient-to-r from-[#00f0ff] to-[#ff00ff] mb-2 drop-shadow-[0_0_20px_rgba(0,240,255,0.6)]">BEAM</div>
              <p className="text-gray-300 font-bold tracking-widest uppercase text-xs">Stream Boldly.</p>
            </div>

            <form onSubmit={handleEmailAuth} className="space-y-5">
              {!isLogin && (
                <div className="relative">
                  <UserPlus className="absolute left-4 top-1/2 -translate-y-1/2 text-[#00f0ff]" size={20} />
                  <input type="text" placeholder="Display Name" value={name} onChange={(e) => setName(e.target.value)} required={!isLogin} className="w-full glass-input rounded-xl py-3 pl-12 pr-4 text-white outline-none transition-all placeholder-gray-500 font-medium" />
                </div>
              )}
              <div className="relative">
                <Mail className="absolute left-4 top-1/2 -translate-y-1/2 text-[#00f0ff]" size={20} />
                <input type="email" placeholder="Email Address" value={email} onChange={(e) => setEmail(e.target.value)} required className="w-full glass-input rounded-xl py-3 pl-12 pr-4 text-white outline-none transition-all placeholder-gray-500 font-medium" />
              </div>
              <div className="relative">
                <Lock className="absolute left-4 top-1/2 -translate-y-1/2 text-[#00f0ff]" size={20} />
                <input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} required className="w-full glass-input rounded-xl py-3 pl-12 pr-4 text-white outline-none transition-all placeholder-gray-500 font-medium" />
              </div>

              {error && <div className="text-[#ff00ff] text-sm font-bold text-center bg-[#ff00ff]/10 border border-[#ff00ff]/30 rounded-lg p-3 shadow-[0_0_15px_rgba(255,0,255,0.2)]">{error}</div>}

              <button type="submit" disabled={loading} className="w-full py-4 neon-btn text-white font-black uppercase tracking-wider rounded-xl flex items-center justify-center gap-2 mt-8">
                {loading ? <div className="w-6 h-6 border-4 border-white/30 border-t-white rounded-full animate-spin" /> : (isLogin ? <><LogIn size={22}/> Ignite Session</> : <><UserPlus size={22}/> Join The Grid</>)}
              </button>
            </form>

            <div className="relative flex items-center justify-center py-8">
              <div className="absolute inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent" />
              <span className="relative bg-[#020204] px-4 text-xs text-gray-500 font-black uppercase tracking-[0.2em] rounded-full border border-white/5">OR</span>
            </div>

            <div className="space-y-4">
              <button onClick={handleGoogleAuth} disabled={loading} className="w-full py-3.5 bg-white/5 hover:bg-white/10 text-white font-bold rounded-xl transition-all border border-white/10 flex items-center justify-center gap-3 backdrop-blur-md">
                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
                Sync via Google
              </button>
              
              <button onClick={handleGuestAuth} disabled={loading} className="w-full py-3.5 bg-transparent hover:bg-white/5 text-gray-400 hover:text-white font-bold rounded-xl transition-all border border-transparent hover:border-white/10 flex items-center justify-center gap-2">
                Ghost Protocol <ArrowRight size={18} className="text-[#00f0ff]" />
              </button>
            </div>

            <p className="text-center text-gray-400 mt-8 text-sm font-medium">
              {isLogin ? "No access codes?" : "Already established?"}{" "}
              <button onClick={() => setIsLogin(!isLogin)} className="text-[#ff00ff] font-black tracking-wide hover:text-[#00f0ff] transition-colors uppercase ml-2">
                {isLogin ? "Initialize" : "Authenticate"}
              </button>
            </p>
          </div>
        </div>
      );
    };

    // 1. Landing & Cinematic Intro Component
    const LandingScreen = ({ user, onComplete }) => {
      const [phase, setPhase] = useState('profiles');

      const getPrimaryName = () => {
        if (user?.displayName) return user.displayName.split(' ')[0];
        if (user?.isAnonymous) return 'Ghost';
        return 'Primary';
      };

      const profiles = [
        { id: '1', name: getPrimaryName(), color: 'from-[#00f0ff] to-blue-700' },
        { id: '2', name: 'Network', color: 'from-[#ff00ff] to-purple-700' },
        { id: '3', name: 'Rookies', color: 'from-amber-400 to-orange-600' }
      ];

      const handleProfileSelect = () => {
        setPhase('intro');
        setTimeout(() => onComplete(), 3800); 
      };

      if (phase === 'profiles') {
        return (
          <div className="fixed inset-0 bg-[#020204] z-[100] flex flex-col items-center justify-center p-6 animate-in fade-in duration-500 overflow-hidden">
            <div className="absolute top-[-20%] left-[-10%] w-[800px] h-[800px] bg-[#00f0ff]/10 rounded-full blur-[150px] animate-orb pointer-events-none" />
            <div className="absolute bottom-[-20%] right-[-10%] w-[800px] h-[800px] bg-[#ff00ff]/10 rounded-full blur-[150px] animate-orb pointer-events-none" style={{animationDelay: '-3s'}} />

            <div className="absolute top-12 text-2xl font-black tracking-[0.5em] text-white/30 drop-shadow-[0_0_10px_rgba(255,255,255,0.1)]">BEAM</div>
            <h1 className="text-4xl md:text-6xl font-black text-white mb-16 drop-shadow-[0_0_20px_rgba(0,240,255,0.3)] tracking-tight">Access Terminal?</h1>
            
            <div className="flex flex-wrap justify-center gap-10 md:gap-16 z-10">
              {profiles.map(p => (
                <div key={p.id} onClick={handleProfileSelect} className="group cursor-pointer flex flex-col items-center gap-6">
                  <div className={`w-32 h-32 md:w-44 md:h-44 rounded-[2rem] bg-gradient-to-br ${p.color} shadow-[0_10px_30px_rgba(0,0,0,0.8)] group-hover:scale-110 group-hover:shadow-[0_0_60px_rgba(0,240,255,0.5)] transition-all duration-500 border-2 border-white/10 group-hover:border-white/50 flex items-center justify-center relative overflow-hidden`}>
                    <div className="absolute inset-0 bg-white/20 backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300" />
                    <User size={56} className="text-white drop-shadow-xl relative z-10" />
                  </div>
                  <span className="text-gray-400 font-bold text-xl tracking-widest uppercase group-hover:text-white group-hover:drop-shadow-[0_0_10px_rgba(255,255,255,0.8)] transition-all">{p.name}</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div className="fixed inset-0 bg-black z-[100] flex items-center justify-center overflow-hidden">
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#00f0ff] shadow-[0_0_40px_10px_#00f0ff] z-[5] beam-strike" />
          <div className="absolute inset-0 filter blur-[24px] z-[2] opacity-0 beam-light-sweep" />
          <div className="relative text-[20vw] font-black z-10 opacity-0 beam-text-anim">
            <span className="absolute inset-0 beam-cyan-split z-[-1] drop-shadow-[0_0_30px_rgba(0,240,255,0.8)]">BEAM</span>
            <span className="text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.8)] relative z-10">BEAM</span>
            <span className="absolute inset-0 beam-magenta-split z-[-1] drop-shadow-[0_0_30px_rgba(255,0,255,0.8)]">BEAM</span>
          </div>
        </div>
      );
    };

    // 2. Glassmorphic Floating Navigation
    const FloatingNav = ({ currentView, setView }) => {
      const navItems = [
        { id: 'home', icon: Home, label: 'Hub' },
        { id: 'series', icon: Tv, label: 'Series' },
        { id: 'movies', icon: Film, label: 'Movies' },
        { id: 'search', icon: Search, label: 'Search' },
        { id: 'list', icon: Bookmark, label: 'Vault' },
        { id: 'profile', icon: User, label: 'System' },
      ];

      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-[90%] md:w-auto">
          <nav className="glass-panel rounded-full px-4 py-3 flex items-center justify-between md:justify-center gap-2 md:gap-6 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border-white/20">
            {navItems.map(item => {
              const isActive = currentView === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setView(item.id)}
                  className={`relative flex items-center justify-center w-12 h-12 rounded-full transition-all duration-300 group ${
                    isActive ? 'bg-[#00f0ff]/20 text-[#00f0ff] shadow-[inset_0_0_20px_rgba(0,240,255,0.3),0_0_15px_rgba(0,240,255,0.4)] border border-[#00f0ff]/50' : 'text-gray-400 hover:text-white hover:bg-white/10'
                  }`}
                >
                  <item.icon size={isActive ? 22 : 20} className={`transition-all duration-300 ${isActive ? 'scale-110 drop-shadow-[0_0_8px_rgba(0,240,255,0.8)]' : ''}`} />
                  <span className="absolute -top-12 bg-black/90 px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest text-white opacity-0 group-hover:opacity-100 transition-opacity hidden md:block whitespace-nowrap pointer-events-none border border-[#00f0ff]/30 shadow-[0_0_15px_rgba(0,240,255,0.3)]">
                    {item.label}
                  </span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    };

    // 3. Explosive Media Card
    const MediaCard = ({ item, onClick, progress }) => {
      const imageUrl = item.poster_path || item.backdrop_path ? `${IMAGE_BASE_URL}w500${item.poster_path || item.backdrop_path}` : 'https://via.placeholder.com/500x750?text=NO+DATA';
      const title = item.title || item.name;

      return (
        <div onClick={() => onClick(item)} className="relative flex-none w-[150px] md:w-[220px] aspect-[2/3] rounded-2xl overflow-hidden cursor-pointer group bg-[#0a0a0f] border border-white/5 shadow-lg transition-all duration-500 hover:border-[#00f0ff]/60 hover:shadow-[0_0_40px_rgba(0,240,255,0.4)] hover:-translate-y-2">
          <img src={imageUrl} alt={title} loading="lazy" className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 group-hover:opacity-40" />
          
          <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10">
            <div className="w-14 h-14 rounded-full bg-[#00f0ff]/20 backdrop-blur-md flex items-center justify-center border border-[#00f0ff]/50 text-[#00f0ff] drop-shadow-[0_0_20px_rgba(0,240,255,1)] scale-50 group-hover:scale-100 transition-transform duration-500 cubic-bezier(0.175, 0.885, 0.32, 1.275)">
              <Play fill="currentColor" size={24} className="ml-1" />
            </div>
          </div>

          <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-100 flex flex-col justify-end p-4 z-0">
            <h4 className="text-white font-black text-sm md:text-base truncate drop-shadow-[0_0_5px_rgba(0,0,0,1)] tracking-wide">{title}</h4>
            {item.vote_average && <span className="text-[10px] md:text-xs text-[#00f0ff] font-black tracking-widest flex items-center gap-1 mt-1 drop-shadow-[0_0_5px_rgba(0,240,255,0.5)]">★ {item.vote_average.toFixed(1)}</span>}
          </div>
          
          {progress && (
            <div className="absolute bottom-0 left-0 right-0 h-1.5 bg-black/80 z-20">
              <div className="h-full bg-gradient-to-r from-[#00f0ff] to-[#ff00ff] shadow-[0_0_15px_rgba(0,240,255,0.8)]" style={{ width: `${progress}%` }} />
            </div>
          )}
        </div>
      );
    };

    // 4. Media Row (Horizontal Scroll)
    const MediaRow = ({ title, items, onCardClick, isContinueWatching = false }) => {
      const rowRef = useRef(null);

      const scroll = (direction) => {
        if (rowRef.current) {
          const { scrollLeft, clientWidth } = rowRef.current;
          rowRef.current.scrollTo({ left: direction === 'left' ? scrollLeft - clientWidth + 100 : scrollLeft + clientWidth - 100, behavior: 'smooth' });
        }
      };

      if (!items || items.length === 0) return null;

      return (
        <div className="mb-14 relative group">
          <h3 className="text-2xl md:text-3xl font-black text-white mb-6 px-6 md:px-12 flex items-center gap-4 drop-shadow-[0_0_10px_rgba(255,255,255,0.2)] tracking-tight">
            {title}
            <div className="h-[2px] flex-1 bg-gradient-to-r from-[#00f0ff]/50 via-[#ff00ff]/30 to-transparent rounded-full shadow-[0_0_10px_rgba(0,240,255,0.5)]" />
          </h3>
          
          <button onClick={() => scroll('left')} className="absolute left-0 top-[60%] -translate-y-1/2 z-20 w-20 h-full max-h-[330px] bg-gradient-to-r from-[#020204] to-transparent opacity-0 group-hover:opacity-100 transition-opacity hidden md:flex items-center justify-start pl-4">
            <ChevronLeft size={48} className="text-white hover:text-[#00f0ff] hover:drop-shadow-[0_0_15px_rgba(0,240,255,0.8)] transition-all hover:scale-110" />

    // 5. Epic Detail Modal
    const DetailModal = ({ item, onClose, onPlay, userList, toggleList }) => {
      if (!item) return null;
      const isMovie = item.media_type === 'movie' || item.title;

          <div className="relative w-full h-full md:h-auto max-w-6xl glass-panel md:rounded-[2rem] overflow-hidden shadow-[0_0_80px_rgba(0,240,255,0.15)] flex flex-col md:max-h-[90vh]">
            <div className="relative w-full h-[45vh] md:h-[55vh] shrink-0">
              {backdropUrl ? <img src={backdropUrl} alt={title} className="w-full h-full object-cover" /> : <div className="w-full h-full bg-[#050508]" />}
              <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0f] via-[#0a0a0f]/40 to-transparent" />
              <button onClick={onClose} className="absolute top-6 right-6 w-12 h-12 glass-panel rounded-full flex items-center justify-center text-white hover:bg-white/20 hover:text-[#ff00ff] transition-all hover:scale-110 hover:shadow-[0_0_20px_rgba(255,0,255,0.5)] z-10"><X size={24} strokeWidth={3} /></button>
            </div>

            <div className="relative -mt-32 px-6 md:px-16 pb-12 flex-1 overflow-y-auto hide-scrollbar z-10">
              <h2 className="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-400 mb-4 drop-shadow-[0_0_20px_rgba(255,255,255,0.2)] tracking-tighter leading-tight">{title}</h2>
              
              <div className="flex items-center gap-4 text-xs font-black tracking-widest mb-10 uppercase">
                <span className="px-4 py-1.5 glass-panel text-white rounded-lg border-[#00f0ff]/30 shadow-[0_0_15px_rgba(0,240,255,0.2)]">{year}</span>
                <span className="px-4 py-1.5 bg-gradient-to-r from-[#ff00ff]/20 to-transparent border border-[#ff00ff]/50 text-[#ff00ff] rounded-lg shadow-[0_0_15px_rgba(255,0,255,0.3)]">{isMovie ? 'MOVIE' : 'SERIES'}</span>
                {item.vote_average && <span className="flex items-center gap-1 text-[#00f0ff] bg-[#00f0ff]/10 px-4 py-1.5 rounded-lg border border-[#00f0ff]/30 shadow-[0_0_10px_rgba(0,240,255,0.2)]">★ {item.vote_average.toFixed(1)}</span>}

              <div className="flex flex-wrap gap-5 mb-12">
                <button onClick={() => onPlay(item, isMovie ? null : 1, isMovie ? null : 1)} className="flex items-center gap-3 px-10 py-4 neon-btn text-white rounded-2xl font-black text-xl uppercase tracking-wider hover:scale-105 active:scale-95">
                  <Play fill="currentColor" size={24} /> {isMovie ? 'Initialize' : 'S1:E1 Begin'}
                </button>
                <button onClick={() => toggleList(item)} className={`flex items-center gap-3 px-8 py-4 rounded-2xl font-black text-lg uppercase tracking-widest transition-all hover:scale-105 active:scale-95 border ${inList ? 'glass-panel bg-[#ff00ff]/20 border-[#ff00ff]/50 text-white shadow-[0_0_20px_rgba(255,0,255,0.3)]' : 'glass-panel text-gray-400 hover:text-white hover:border-[#00f0ff]/50 hover:shadow-[0_0_20px_rgba(0,240,255,0.2)]'}`}>
                  {inList ? <Check size={24} className="text-[#ff00ff]" /> : <Plus size={24} className="text-[#00f0ff]" />} {inList ? 'Saved' : 'Save To Vault'}
                </button>
              </div>

              <div className="glass-panel p-6 rounded-2xl border-white/5">
                <p className="text-gray-300 text-lg md:text-xl leading-relaxed font-medium">{item.overview || "No transmission data available for this sector."}</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // 6. Explosive Player Modal & Sleek Controls
    const PlayerModal = ({ item, initSeason, initEpisode, onClose, globalSettings, saveProgress }) => {
      const [loading, setLoading] = useState(true);
      const [activeServer, setActiveServer] = useState(globalSettings.provider);
      const [strictMode, setStrictMode] = useState(globalSettings.strictMode);
      
      const isMovie = item.media_type === 'movie' || item.title;
      const [season, setSeason] = useState(initSeason || 1);
      const [episode, setEpisode] = useState(initEpisode || 1);

      const serverDef = SERVERS.find(s => s.id === activeServer) || SERVERS[0];

      useEffect(() => { setLoading(true); }, [videoUrl]);
      useEffect(() => {
        const timer = setTimeout(() => saveProgress(item, Math.floor(Math.random() * 80) + 10), 15000);
        return () => clearTimeout(timer);
      }, [item, saveProgress, season, episode]);

      return (
        <div className="fixed inset-0 z-[90] bg-[#020204] flex flex-col animate-in zoom-in-95 duration-300">
          <div className="absolute top-0 left-0 right-0 p-4 md:p-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 z-20 bg-gradient-to-b from-[#020204] via-[#020204]/80 to-transparent">
            <div className="flex items-center gap-5 max-w-full">
              <button onClick={onClose} className="w-12 h-12 glass-panel rounded-full flex items-center justify-center text-white hover:text-[#ff00ff] transition-all border-[#ff00ff]/30 hover:border-[#ff00ff] hover:shadow-[0_0_20px_rgba(255,0,255,0.5)] shrink-0">
                <ChevronLeft size={28} strokeWidth={3} />
              </button>
              <div className="overflow-hidden">
                <h3 className="text-white font-black text-xl md:text-3xl drop-shadow-[0_0_10px_rgba(0,0,0,1)] truncate tracking-tight">{item.title || item.name}</h3>
                {!isMovie && <span className="text-[#00f0ff] text-sm md:text-base font-black tracking-widest uppercase drop-shadow-[0_0_10px_rgba(0,240,255,0.5)]">S{season} // E{episode}</span>}
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-4 w-full xl:w-auto">
              {!isMovie && (
                <div className="flex items-center glass-panel rounded-xl overflow-hidden shadow-[0_0_20px_rgba(0,240,255,0.15)] border-[#00f0ff]/20">
                  <button onClick={() => setEpisode(Math.max(1, episode - 1))} disabled={episode <= 1} className="p-3 text-gray-400 hover:text-[#00f0ff] hover:bg-white/5 transition-colors disabled:opacity-30">
                    <ChevronLeft size={20} strokeWidth={3} />
                  </button>

                  <div className="flex items-center px-3 py-2 border-l border-r border-white/10 bg-white/5">
                    <span className="text-[11px] text-[#00f0ff] font-black mr-2 uppercase tracking-widest drop-shadow-[0_0_5px_rgba(0,240,255,0.8)]">S</span>
                    <select value={season} onChange={(e) => { setSeason(Number(e.target.value)); setEpisode(1); }} className="bg-transparent text-white font-black outline-none cursor-pointer appearance-none text-center pr-2">
                      {[...Array(25)].map((_, i) => <option key={i+1} value={i+1} className="bg-[#050508]">{i+1}</option>)}
                    </select>
                  </div>

                  <div className="flex items-center px-3 py-2 border-r border-white/10 bg-white/5">
                    <span className="text-[11px] text-[#ff00ff] font-black mr-2 uppercase tracking-widest drop-shadow-[0_0_5px_rgba(255,0,255,0.8)]">E</span>
                    <select value={episode} onChange={(e) => setEpisode(Number(e.target.value))} className="bg-transparent text-white font-black outline-none cursor-pointer appearance-none text-center pr-2">
                      {[...Array(50)].map((_, i) => <option key={i+1} value={i+1} className="bg-[#050508]">{i+1}</option>)}
                    </select>
                  </div>

                  <button onClick={() => setEpisode(episode + 1)} className="p-3 text-gray-400 hover:text-[#ff00ff] hover:bg-white/5 transition-colors">
                    <ChevronRight size={20} strokeWidth={3} />
                  </button>
                </div>
              )}

              <div className="flex items-center glass-panel rounded-xl overflow-hidden shadow-[0_0_20px_rgba(255,0,255,0.15)] border-[#ff00ff]/20">
                <div className="flex items-center gap-2 px-4 py-3 border-r border-white/10 hover:bg-white/5 transition-colors">
                  <MonitorPlay size={18} className="text-[#00f0ff]" />
                  <select value={activeServer} onChange={(e) => setActiveServer(e.target.value)} className="bg-transparent text-white font-bold tracking-wide outline-none cursor-pointer appearance-none pr-2 text-sm uppercase">
                    {SERVERS.map(s => <option key={s.id} value={s.id} className="bg-[#050508]">{s.name}</option>)}
                  </select>
                </div>

                <button onClick={() => setStrictMode(!strictMode)} className={`flex items-center gap-2 px-5 py-3 transition-all text-xs uppercase tracking-widest font-black ${strictMode ? 'bg-[#00f0ff]/20 text-[#00f0ff] shadow-[inset_0_0_15px_rgba(0,240,255,0.3)]' : 'bg-red-500/20 text-red-400 shadow-[inset_0_0_15px_rgba(255,0,0,0.3)]'}`}>
                  {strictMode ? <Shield size={18} /> : <ShieldAlert size={18} />}
                  <span className="hidden sm:inline">Shield {strictMode ? 'ON' : 'OFF'}</span>
                </button>
              </div>
            </div>
          </div>
          
          <div className="flex-1 relative w-full h-full bg-[#020204]">
            {loading && (
              <div className="absolute inset-0 flex items-center justify-center flex-col gap-6 z-10 bg-[#020204]">
                <div className="relative w-24 h-24">
                  <div className="absolute inset-0 border-4 border-[#00f0ff]/20 rounded-full" />
                  <div className="absolute inset-0 border-4 border-[#00f0ff] rounded-full border-t-transparent animate-spin" />
                  <div className="absolute inset-4 border-4 border-[#ff00ff]/20 rounded-full" />
                  <div className="absolute inset-4 border-4 border-[#ff00ff] rounded-full border-b-transparent animate-spin reverse" style={{animationDirection: 'reverse', animationDuration: '1.5s'}} />
                </div>
                <p className="text-white font-black tracking-[0.3em] uppercase text-sm animate-pulse drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]">Establishing Link</p>
              </div>
            )}
            
            {!strictMode && (
              <div className="absolute bottom-10 left-1/2 -translate-x-1/2 glass-panel border border-red-500/50 bg-red-950/80 text-white px-6 py-4 rounded-xl text-xs md:text-sm font-black uppercase tracking-widest z-10 flex items-center gap-4 animate-pulse shadow-[0_0_40px_rgba(255,0,0,0.4)] whitespace-nowrap">
                <ShieldAlert size={24} className="text-red-400" />
                Shields Down. Adblocker Required to prevent breaches.
              </div>
            )}

            <iframe src={videoUrl} className="w-full h-full border-none" allowFullScreen onLoad={() => setLoading(false)} sandbox={strictMode ? "allow-scripts allow-same-origin allow-presentation" : undefined} title="Video Player" />
          </div>
        </div>
      );
    };

    // --- MAIN APP ENTRY ---
    function App() {
      const [appState, setAppState] = useState('loading'); 
      const [user, setUser] = useState(null);
      const [view, setView] = useState('home');
      const [searchQuery, setSearchQuery] = useState('');
      const [dbError, setDbError] = useState('');
      
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('beam_ultimate_settings');
        return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
      });

      useEffect(() => { localStorage.setItem('beam_ultimate_settings', JSON.stringify(settings)); }, [settings]);

      const updateSetting = (key, val) => setSettings(prev => ({ ...prev, [key]: val }));

      const [trending, setTrending] = useState([]);
      const [movies, setMovies] = useState([]);
      const [series, setSeries] = useState([]);
      const [searchResults, setSearchResults] = useState([]);
      
      const [continueWatching, setContinueWatching] = useState([]);
      const [userList, setUserList] = useState([]);
      
      const [selectedItem, setSelectedItem] = useState(null);
      const [playingItem, setPlayingItem] = useState(null);
      const [playSeason, setPlaySeason] = useState(1);
      const [playEpisode, setPlayEpisode] = useState(1);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          if (currentUser) {
            if (appState === 'loading' || appState === 'auth') setAppState('profiles');
          } else {
            setAppState('auth');
          }
        });
        return () => unsubscribe();
      }, [appState]);

      useEffect(() => {
        if (!user) return;
        const cwQuery = query(collection(db, 'artifacts', appId, 'users', user.uid, 'continue_watching'));
        const unsubCW = onSnapshot(cwQuery, (snapshot) => {
            setDbError('');
            const items = [];
            snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
            items.sort((a, b) => b.updatedAt - a.updatedAt);
            setContinueWatching(items);
          }, (error) => {
            console.error("Firestore CW error:", error);
            if (error.code === 'permission-denied' || error.message.includes('permissions')) {
              setDbError("Firebase Rules Error: Please update your Firestore Security Rules to allow read/write access.");
            }
          });

        const listQuery = query(collection(db, 'artifacts', appId, 'users', user.uid, 'my_list'));
        const unsubList = onSnapshot(listQuery, (snapshot) => {
            const ids = [];
            snapshot.forEach(doc => ids.push(doc.id));
            setUserList(ids);
          }, (error) => console.error("Firestore List error:", error));

        return () => { unsubCW(); unsubList(); };
      }, [user]);

      useEffect(() => {
        const loadContent = async () => {
          try {
            const [trendData, movieData, tvData] = await Promise.all([
              fetchTMDB('/trending/all/day'), fetchTMDB('/movie/popular'), fetchTMDB('/tv/popular')
            ]);
            setTrending(trendData.results.slice(0, 15));
            setMovies(movieData.results.slice(0, 15));
            setSeries(tvData.results.slice(0, 15));
          } catch (err) { console.error("Data load error:", err); }
        };
        loadContent();
      }, []);

      useEffect(() => {
        if (searchQuery.trim().length < 2) { setSearchResults([]); return; }
        const delay = setTimeout(async () => {
          const data = await fetchTMDB('/search/multi', { query: searchQuery });
          setSearchResults(data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv'));
        }, 500);
        return () => clearTimeout(delay);
      }, [searchQuery]);

      const saveProgress = async (item, progressPercent) => {
        if (!user) return;
        try { await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'continue_watching', item.id.toString()), { itemData: item, progress: progressPercent, updatedAt: Date.now() }); } 
        catch (err) { 
          console.error("Error saving progress:", err);
          if (err.code === 'permission-denied') setDbError("Firebase Rules Error: Cannot save progress. Please update your Firestore Security Rules.");
        }
      };

      const toggleList = async (item) => {
        if (!user) return;
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'my_list', item.id.toString());
          userList.includes(item.id.toString()) ? await deleteDoc(docRef) : await setDoc(docRef, { itemData: item, addedAt: Date.now() });
        } catch (err) { console.error("Error toggling list", err); }
      };

      const clearHistory = async () => {
        if (!user || !window.confirm("Purge all viewing history?")) return;
        try {
          const snapshot = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'continue_watching'));
          snapshot.forEach(async (docSnap) => await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'continue_watching', docSnap.id)));
        } catch (err) { console.error("Error clearing history", err); }
      };

      const handlePlay = (item, s = 1, e = 1) => {
        setSelectedItem(null);
        setPlaySeason(s);
        setPlayEpisode(e);
        setPlayingItem(item);
      };

      if (appState === 'loading') {
        return (
          <div className="fixed inset-0 bg-[#020204] flex items-center justify-center z-[200]">
            <div className="w-20 h-20 border-4 border-[#00f0ff]/30 border-t-[#00f0ff] rounded-full animate-spin drop-shadow-[0_0_20px_rgba(0,240,255,0.8)]" />
          </div>
        );
      }

      if (appState === 'auth') return <AuthScreen />;
      if (appState === 'profiles' || appState === 'intro') return <LandingScreen user={user} onComplete={() => setAppState('main')} />;

      const renderContent = () => {
        switch (view) {
          case 'search':
            return (
              <div className="pt-16 px-6 md:px-12 pb-32 animate-in fade-in">
                <div className="relative max-w-4xl mx-auto mb-16">
                  <Search className="absolute left-6 top-1/2 -translate-y-1/2 text-[#00f0ff] drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]" size={32} />
                  <input type="text" placeholder="Scan for transmissions..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full glass-panel rounded-[2rem] py-6 pl-20 pr-8 text-white text-2xl font-black uppercase tracking-widest focus:outline-none focus:border-[#00f0ff]/50 focus:shadow-[0_0_40px_rgba(0,240,255,0.2)] transition-all placeholder-gray-500" />
                </div>
                {searchQuery && searchResults.length > 0 && (
                  <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-6">
                    {searchResults.map(item => <MediaCard key={item.id} item={item} onClick={setSelectedItem} />)}
                  </div>
                )}
              </div>
            );
          case 'list':
            const listItems = userList.map(id => [...trending, ...movies, ...series, ...continueWatching.map(c => c.itemData)].find(i => i.id.toString() === id)).filter(Boolean);
            return (
              <div className="pt-16 px-6 md:px-12 pb-32 animate-in fade-in">
                <h2 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#00f0ff] to-white mb-12 tracking-tight drop-shadow-[0_0_15px_rgba(0,240,255,0.5)]">The Vault</h2>
                {listItems.length > 0 ? (
                  <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-6">
                    {listItems.map((item, i) => <MediaCard key={i} item={item} onClick={setSelectedItem} />)}
                  </div>
                ) : (
                  <div className="text-center mt-32 p-16 glass-panel rounded-[3rem] max-w-2xl mx-auto border-dashed border-[#ff00ff]/30">
                    <Bookmark size={80} className="mx-auto mb-8 text-[#ff00ff] drop-shadow-[0_0_20px_rgba(255,0,255,0.8)]" />
                    <h3 className="text-3xl text-white font-black mb-4 uppercase tracking-widest">Vault Empty</h3>
                    <p className="text-gray-400 mb-10 text-lg">No transmissions saved in this sector.</p>
                    <button onClick={() => setView('home')} className="px-10 py-4 neon-btn text-white font-black rounded-xl uppercase tracking-widest">Return to Hub</button>
                  </div>
                )}
              </div>
            );
          case 'profile':
            return (
              <div className="pt-16 px-6 md:px-12 pb-32 max-w-5xl mx-auto animate-in slide-in-from-bottom-12">
                <h2 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#ff00ff] to-white mb-12 tracking-tight drop-shadow-[0_0_15px_rgba(255,0,255,0.5)]">System Config</h2>
                <div className="grid gap-8">
                  <div className="glass-panel rounded-[2rem] p-10 border-[#00f0ff]/20 shadow-[0_0_40px_rgba(0,240,255,0.1)]">
                    <h3 className="text-2xl font-black text-white mb-8 flex items-center gap-4 uppercase tracking-widest"><MonitorPlay className="text-[#00f0ff] drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]" size={32} /> Playback Protocol</h3>
                    <div className="space-y-8">
                      <div className="flex flex-col md:flex-row justify-between md:items-center gap-6">
                        <div>
                          <p className="text-white font-black text-xl uppercase tracking-wide">Primary Node</p>
                          <p className="text-gray-400 text-sm mt-1">Select your preferred source grid.</p>
                        </div>
                        <select value={settings.provider} onChange={(e) => updateSetting('provider', e.target.value)} className="bg-[#050508] border border-[#00f0ff]/50 text-[#00f0ff] rounded-xl px-6 py-4 outline-none focus:shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-all font-black uppercase tracking-widest cursor-pointer">
                          {SERVERS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      </div>
                      <div className="h-px bg-gradient-to-r from-transparent via-[#00f0ff]/30 to-transparent w-full" />
                      <div className="flex flex-col md:flex-row justify-between md:items-center gap-6">
                        <div>
                          <p className="text-white font-black text-xl uppercase tracking-wide flex items-center gap-3">Deflector Shield {!settings.strictMode && <ShieldAlert size={20} className="text-red-500 drop-shadow-[0_0_10px_rgba(255,0,0,0.8)]" />}</p>
                          <p className="text-gray-400 text-sm max-w-md mt-2">Activate sandbox to block hostile popups. May cause node failure. Deactivate if using external defenses.</p>
                        </div>
                        <button onClick={() => updateSetting('strictMode', !settings.strictMode)} className={`relative w-20 h-10 rounded-full transition-all border ${settings.strictMode ? 'bg-[#00f0ff]/20 border-[#00f0ff] shadow-[0_0_20px_rgba(0,240,255,0.4)]' : 'bg-[#050508] border-gray-700'}`}>
                          <div className={`absolute top-1 left-1 w-8 h-8 rounded-full transition-transform duration-300 ${settings.strictMode ? 'bg-[#00f0ff] translate-x-10 shadow-[0_0_15px_rgba(0,240,255,1)]' : 'bg-gray-600 translate-x-0'}`} />
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="grid md:grid-cols-2 gap-8">
                    <div className="glass-panel rounded-[2rem] p-10 border-red-500/20 shadow-[0_0_40px_rgba(255,0,0,0.1)]">
                      <h3 className="text-2xl font-black text-white mb-6 flex items-center gap-4 uppercase tracking-widest"><Trash2 className="text-red-500 drop-shadow-[0_0_10px_rgba(255,0,0,0.8)]" size={32} /> Memory</h3>
                      <p className="text-gray-400 text-sm mb-8">Purge all viewing history and progress data.</p>
                      <button onClick={clearHistory} className="w-full py-4 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-black tracking-widest uppercase rounded-xl transition-all border border-red-500/30 shadow-[0_0_20px_rgba(255,0,0,0.2)]">Initiate Purge</button>
                    </div>
                    <div className="glass-panel rounded-[2rem] p-10 border-[#ff00ff]/20 shadow-[0_0_40px_rgba(255,0,255,0.1)]">
                      <h3 className="text-2xl font-black text-white mb-6 flex items-center gap-4 uppercase tracking-widest"><User className="text-[#ff00ff] drop-shadow-[0_0_10px_rgba(255,0,255,0.8)]" size={32} /> Identity</h3>
                      <p className="text-gray-400 text-sm mb-8 font-mono truncate">{user?.displayName ? `User: ${user.displayName}` : `UID: ${user?.uid || 'Ghost'}`}</p>
                      <button onClick={() => signOut(auth)} className="w-full py-4 bg-[#ff00ff]/10 hover:bg-[#ff00ff]/20 text-[#ff00ff] font-black tracking-widest uppercase rounded-xl transition-all border border-[#ff00ff]/30 shadow-[0_0_20px_rgba(255,0,255,0.2)] flex justify-center items-center gap-3"><LogOut size={22} /> Sever Connection</button>
                    </div>
                  </div>
                </div>
              </div>
            );
          case 'home':
          default:
            const heroItem = trending[0];
            return (
              <div className="pb-32 animate-in fade-in">
                {heroItem && (
                  <div className="relative w-full h-[80vh] md:h-[90vh] mb-16 overflow-hidden">
                    <img src={`${IMAGE_BASE_URL}original${heroItem.backdrop_path}`} alt="Hero" className="absolute inset-0 w-full h-full object-cover scale-[1.02]" />
                    <div className="absolute inset-0 bg-gradient-to-r from-[#020204] via-[#020204]/70 to-transparent" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#020204] via-transparent to-transparent" />
                    
                    <div className="absolute bottom-[12%] left-6 md:left-12 md:w-2/3 flex flex-col items-start z-10">
                      <span className="px-6 py-2 glass-panel text-[#00f0ff] rounded-xl text-xs font-black tracking-[0.3em] mb-8 border border-[#00f0ff]/30 shadow-[0_0_20px_rgba(0,240,255,0.3)]">CRITICAL TRANSMISSION</span>
                      <h1 className="text-6xl md:text-8xl lg:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-400 mb-8 drop-shadow-[0_0_40px_rgba(0,0,0,0.8)] leading-[1.05] tracking-tighter">
                        {heroItem.title || heroItem.name}
                      </h1>
                      <p className="text-gray-300 text-xl md:text-2xl line-clamp-3 mb-12 max-w-3xl font-medium drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] leading-relaxed">
                        {heroItem.overview}
                      </p>
                      <div className="flex flex-wrap gap-5">
                        <button onClick={() => handlePlay(heroItem)} className="flex items-center gap-4 px-10 md:px-12 py-5 neon-btn text-white rounded-2xl font-black text-xl uppercase tracking-widest hover:scale-105 active:scale-95">
                          <Play fill="currentColor" size={28} /> INITIALIZE
                        </button>
                        <button onClick={() => setSelectedItem(heroItem)} className="flex items-center gap-4 px-10 md:px-12 py-5 glass-panel text-white rounded-2xl font-black text-xl uppercase tracking-widest hover:scale-105 hover:border-[#ff00ff]/50 hover:shadow-[0_0_30px_rgba(255,0,255,0.3)] transition-all">
                          <Info size={28} /> DECRYPT DATA
                        </button>
                      </div>
                    </div>
                  </div>
                )}
                <div className="relative z-20">
                  {continueWatching.length > 0 && <MediaRow title="Active Streams" items={continueWatching} onCardClick={handlePlay} isContinueWatching={true} />}
                  <MediaRow title={view === 'movies' ? 'Movie Grid' : view === 'series' ? 'Series Grid' : 'Recommended Protocols'} items={view === 'movies' ? movies : view === 'series' ? series : trending} onCardClick={setSelectedItem} />
                  <MediaRow title="High Traffic" items={view === 'movies' ? trending.filter(i=>i.media_type==='movie') : view === 'series' ? trending.filter(i=>i.media_type==='tv') : movies} onCardClick={setSelectedItem} />
                </div>
              </div>
            );
        }
      };

      return (
        <div className="min-h-screen bg-[#020204] text-white font-sans selection:bg-[#00f0ff]/30 overflow-x-hidden relative">
          {dbError && (
            <div className="fixed top-0 left-0 right-0 z-[200] bg-red-600/90 backdrop-blur-md text-white text-center py-3 px-4 text-sm font-bold shadow-[0_0_20px_rgba(255,0,0,0.5)] flex items-center justify-center gap-3">
              <ShieldAlert size={20} />
              {dbError}
              <button onClick={() => setDbError('')} className="ml-auto p-1 hover:bg-white/20 rounded-full transition-colors"><X size={16}/></button>
            </div>
          )}

          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            <div className="absolute top-[-10%] left-[-10%] w-[800px] h-[800px] bg-[#00f0ff]/10 rounded-full blur-[150px] animate-orb" />
            <div className="absolute bottom-[-10%] right-[-10%] w-[1000px] h-[1000px] bg-[#ff00ff]/10 rounded-full blur-[200px] animate-orb" style={{animationDelay: '-2s'}} />
          </div>

          <main className="relative z-10 min-h-screen">{renderContent()}</main>
          
          <FloatingNav currentView={view} setView={setView} />

          {selectedItem && <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} onPlay={handlePlay} userList={userList} toggleList={toggleList} />}
          {playingItem && <PlayerModal item={playingItem} initSeason={playSeason} initEpisode={playEpisode} onClose={() => setPlayingItem(null)} globalSettings={settings} saveProgress={saveProgress} />}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
